name: Cloud DevOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -r app/requirements.txt
          pip install pytest

      - name: Run Pytest
        run: python -m pytest tests/ -v

  build-scan-push:
    name: Build, Scan, Push and Deploy
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker Image
        run: |
          docker build -t cloud-devops-platform:${{ github.sha }} .

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: cloud-devops-platform:${{ github.sha }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL,HIGH

      - name: Tag Docker Image
        run: |
          docker tag cloud-devops-platform:${{ github.sha }} \
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push Docker Image to ECR
        run: |
          docker push \
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy to EC2 using AWS SSM
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
          INSTANCE_ID: i-0e21900a9801dcceb
        run: |
          python3 - <<'PY'
          import json
          import os

          registry = os.environ["ECR_REGISTRY"]
          repository = os.environ["ECR_REPOSITORY"]
          tag = os.environ["IMAGE_TAG"]
          region = os.environ["AWS_REGION"]

          commands = [
              "set -e",
              f"aws ecr get-login-password --region {region} | docker login --username AWS --password-stdin {registry}",
              f"docker pull {registry}/{repository}:{tag}",
              "docker rm -f cloud-devops-app || true",
              f"docker run -d --name cloud-devops-app -p 80:5000 --restart always {registry}/{repository}:{tag}",
              "sleep 5",
              "curl --fail http://localhost/health"
          ]

          with open("ssm-parameters.json", "w") as f:
              json.dump({"commands": commands}, f)
          PY

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Cloud DevOps application" \
            --parameters file://ssm-parameters.json \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          for i in {1..30}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "StandardOutputContent" \
                --output text
              exit 0
            fi

            if [[ "$STATUS" == "Failed" || "$STATUS" == "TimedOut" || "$STATUS" == "Cancelled" || "$STATUS" == "Cancelling" ]]; then
              aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query "[Status,StandardErrorContent,StandardOutputContent]" \
                --output text
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out. Check AWS Systems Manager command history."
          exit 1
